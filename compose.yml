name: sagduyu

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sagduyu}
      POSTGRES_USER: ${POSTGRES_USER:-sagduyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sagduyu-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-sagduyu-local-only}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: .
    environment:
      SAGDUYU_DATABASE_URL: postgresql://${POSTGRES_USER:-sagduyu}:${POSTGRES_PASSWORD:-sagduyu-local-only}@postgres:5432/${POSTGRES_DB:-sagduyu}
      SAGDUYU_NEO4J_URI: bolt://neo4j:7687
      SAGDUYU_NEO4J_USERNAME: neo4j
      SAGDUYU_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sagduyu-local-only}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: apps/web
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  neo4j_data:
