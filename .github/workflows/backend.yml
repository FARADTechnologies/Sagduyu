name: Backend kalite kontrolleri

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Biçimi doğrula
        run: ruff format --check src tests scripts

      - name: Statik kontrolleri çalıştır
        run: |
          ruff check src tests scripts
          mypy src scripts

      - name: Testleri çalıştır
        run: pytest --cov=sagduyu --cov-report=term-missing --cov-fail-under=85
