name: Backend kalite kontrolleri

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sagduyu_test
          POSTGRES_USER: sagduyu
          POSTGRES_PASSWORD: sagduyu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagduyu -d sagduyu_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Biçimi doğrula
        run: ruff format --check src tests scripts

      - name: Statik kontrolleri çalıştır
        run: |
          ruff check src tests scripts
          mypy src scripts

      - name: Testleri çalıştır
        run: pytest --cov=sagduyu --cov-report=term-missing --cov-fail-under=85
        env:
          SAGDUYU_TEST_DATABASE_URL: postgresql://sagduyu:sagduyu@localhost:5432/sagduyu_test
