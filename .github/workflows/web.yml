name: Web kalite kontrolleri

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Bağımlılıkları yükle
        run: pnpm install --frozen-lockfile

      - name: Tipleri doğrula
        run: pnpm typecheck

      - name: Testleri çalıştır
        run: pnpm test

      - name: Üretim paketini oluştur
        run: pnpm build
